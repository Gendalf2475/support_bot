enabled: true

forms:
  - id: "forgot_password"
    title: "Забыл пароль"
    description: "Форма для восстановления доступа к аккаунту"
    button_text: "🔐 Забыл пароль"
    admin_title: "Заявка на восстановление пароля"
    questions:
      - id: "nickname"
        text: "Введите ваш игровой ник:"
        help_text: "Укажите ник точно так же, как он отображается на сервере."
        required: true
        answer_type: "text"

      - id: "last_login"
        text: "Когда вы примерно последний раз заходили на сервер?"
        help_text: "Например: вчера вечером, неделю назад, 15 апреля."
        required: false
        answer_type: "text"

      - id: "proof"
        text: "Прикрепите доказательства владения аккаунтом, если есть:"
        help_text: "Можно отправить до 5 файлов: фото, видео или документы."
        required: false
        answer_type: "media"
        allow_multiple: true
        max_files: 10

  - id: "player_report"
    title: "Жалоба на игрока"
    description: "Форма для жалобы на нарушителя"
    button_text: "🚨 Жалоба на игрока"
    admin_title: "Жалоба на игрока"
    questions:
      - id: "your_nickname"
        text: "Введите ваш игровой ник:"
        help_text: "Укажите ник точно так же, как он отображается на сервере."
        required: true
        answer_type: "text"

      - id: "violator_nickname"
        text: "Введите ник нарушителя:"
        help_text: "Если нарушителей несколько, укажите их через запятую."
        required: true
        answer_type: "text"

      - id: "reason"
        text: "Опишите нарушение:"
        help_text: "Опишите ситуацию подробно: что произошло, где и когда."
        required: true
        answer_type: "text"

      - id: "proof"
        text: "Прикрепите доказательства:"
        help_text: "Можно отправить до 5 файлов: фото, видео или документы."
        required: true
        answer_type: "media"
        allow_multiple: true
        max_files: 10

  - id: "other"
    title: "Другое"
    description: "Свободное обращение в поддержку"
    button_text: "💬 Другое"
    admin_title: "Другое обращение"
    questions:
      - id: "your_nickname"
        text: "Введите ваш игровой ник:"
        help_text: "Укажите ник точно так же, как он отображается на сервере."
        required: true
        answer_type: "text"

      - id: "message"
        text: "Опишите вашу проблему:"
        help_text: "Постарайтесь описать ситуацию максимально подробно."
        required: true
        answer_type: "any"

enabled: true

forms:
  - id: "forgot_password"
    title: "Забыл пароль"
    description: "Форма для восстановления доступа к аккаунту"
    button_text: "🔐 Забыл пароль"
    admin_title: "Заявка на восстановление пароля"
    success_text: |
      Заявка на восстановление пароля отправлена.
      Обычно проверка занимает до 24 часов.
    close_reasons:
      - id: "restored"
        title: "Доступ восстановлен"
        button_text: "✅ Доступ восстановлен"
        user_message: |
          Ваше обращение закрыто.
          Доступ к аккаунту восстановлен.
        show_to_user: true

      - id: "not_enough_data"
        title: "Недостаточно данных"
        button_text: "📎 Недостаточно данных"
        user_message: |
          Обращение закрыто: недостаточно данных для восстановления доступа.
        show_to_user: true

      - id: "not_owner"
        title: "Владение не подтверждено"
        button_text: "⛔ Владение не подтверждено"
        user_message: |
          Обращение закрыто: не удалось подтвердить владение аккаунтом.
        show_to_user: true
    questions:
      - id: "nickname"
        text: "Введите ваш игровой ник:"
        help_text: "Укажите ник точно так же, как он отображается на сервере."
        required: true
        answer_type: "text"

      - id: "last_login"
        text: "Когда вы примерно последний раз заходили на сервер?"
        help_text: "Например: вчера вечером, неделю назад, 15 апреля."
        required: false
        answer_type: "text"

      - id: "proof"
        text: "Прикрепите доказательства владения аккаунтом, если есть:"
        help_text: "Можно отправить до 5 файлов: фото, видео или документы."
        required: false
        answer_type: "media"
        allow_multiple: true
        max_files: 10

  - id: "player_report"
    title: "Жалоба на игрока"
    description: "Форма для жалобы на нарушителя"
    button_text: "🚨 Жалоба на игрока"
    admin_title: "Жалоба на игрока"
    success_text: |
      Ваша жалоба отправлена.
      Обычно проверка занимает до 24 часов.
    close_reasons:
      - id: "punished"
        title: "Нарушитель наказан"
        button_text: "✅ Нарушитель наказан"
        user_message: |
          Ваша жалоба рассмотрена.
          Нарушитель наказан.
        show_to_user: true

      - id: "not_enough_proof"
        title: "Недостаточно доказательств"
        button_text: "📎 Недостаточно доказательств"
        user_message: |
          Ваша жалоба закрыта, так как доказательств недостаточно.
          В следующий раз приложите скриншоты, видео или другие подтверждения.
        show_to_user: true

      - id: "duplicate"
        title: "Дубликат"
        button_text: "🔁 Дубликат"
        user_message: |
          Этот тикет закрыт как дубликат.
        show_to_user: true
    questions:
      - id: "your_nickname"
        text: "Введите ваш игровой ник:"
        help_text: "Укажите ник точно так же, как он отображается на сервере."
        required: true
        answer_type: "text"

      - id: "violator_nickname"
        text: "Введите ник нарушителя:"
        help_text: "Если нарушителей несколько, укажите их через запятую."
        required: true
        answer_type: "text"

      - id: "reason"
        text: "Опишите нарушение:"
        help_text: "Опишите ситуацию подробно: что произошло, где и когда."
        required: true
        answer_type: "text"

      - id: "proof"
        text: "Прикрепите доказательства:"
        help_text: "Можно отправить до 5 файлов: фото, видео или документы."
        required: true
        answer_type: "media"
        allow_multiple: true
        max_files: 10

  - id: "other"
    title: "Другое"
    description: "Свободное обращение в поддержку"
    button_text: "💬 Другое"
    admin_title: "Другое обращение"
    success_text: |
      Ваше обращение отправлено.
      Ответ придёт сюда.
    close_reasons:
      - id: "resolved"
        title: "Решено"
        button_text: "✅ Решено"
        user_message: |
          Ваше обращение закрыто: вопрос решён.
        show_to_user: true

      - id: "no_user_response"
        title: "Нет ответа от пользователя"
        button_text: "👤 Нет ответа"
        user_message: |
          Ваше обращение закрыто, так как от вас не поступил ответ.
        show_to_user: true
    questions:
      - id: "your_nickname"
        text: "Введите ваш игровой ник:"
        help_text: "Укажите ник точно так же, как он отображается на сервере."
        required: true
        answer_type: "text"

      - id: "message"
        text: "Опишите вашу проблему:"
        help_text: "Постарайтесь описать ситуацию максимально подробно."
        required: true
        answer_type: "any"
